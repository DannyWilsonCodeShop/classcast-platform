version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --prefer-offline
        # Write runtime env vars into .env.production so Next.js SSR can access them
        - |
          echo "CLASSCAST_AWS_REGION=$CLASSCAST_AWS_REGION" >> .env.production
          echo "SNS_ERROR_TOPIC_ARN=$SNS_ERROR_TOPIC_ARN" >> .env.production
    build:
      commands:
        - NODE_OPTIONS="--max-old-space-size=4096" npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  environment:
    variables:
      NEXT_PUBLIC_API_BASE_URL: https://ete1conlc8.execute-api.us-east-1.amazonaws.com/prod
      NEXT_PUBLIC_USER_POOL_ID: us-east-1_zb9BqlWOm
      NEXT_PUBLIC_USER_POOL_CLIENT_ID: 55ei187qtu2f4hv2b02efcsjvv
      SNS_ERROR_TOPIC_ARN: arn:aws:sns:us-east-1:463470937777:classcast-production-errors
      CACHE_BUSTER: "v-2026-08-04-no-keys"
